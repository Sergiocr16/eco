<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Sin zoom: Eco es un shell de app, no un documento. Todo el layout es
         `position: fixed`, así que un pinch accidental descoloca la UI y no
         hay forma de volver. El tamaño de letra donde importa se ajusta desde
         la app (A-/A+ del terminal, zoom del navegador embebido). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <!-- Debe coincidir con `windowBg` del tema dark (design/tokens.ts): es el
         color con el que iOS pinta las zonas que rodean al contenido en la PWA
         instalada. ThemeProvider lo reescribe en runtime para seguir al tema
         activo; este valor es el del primer pintado, antes de que corra React. -->
    <meta name="theme-color" content="#0a0a0c" />
    <link rel="icon" type="image/svg+xml" href="/brand/eco-appicon.svg" />
    <!-- iOS ignora los apple-touch-icon en SVG: sin un PNG el ícono de la
         pantalla de inicio termina siendo una captura de la página. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
    <!-- Instalación en el iPhone/iPad. Los meta apple-* siguen siendo el camino
         confiable aunque iOS 17.4+ ya respete `display: standalone` del
         manifest. `black-translucent`: la barra de estado deja ver el fondo de
         la app (sin franja negra arriba). El colchón que esquiva el blur que
         iOS 26.1+/27 pinta sobre el borde superior del web view vive en
         lib/platform.ts (SAFE_TOP) — ese blur aparece con CUALQUIER valor de
         este meta. Se probó `black` (opaca): quita la banda muerta de ~62pt
         que el bug de WebKit #301994 deja debajo de la nav en el iPhone
         vertical, pero pinta una franja negra arriba; se prefirió el fondo
         continuo. Limitación conocida: los símbolos son blancos también en
         temas claros. iOS captura este meta al agregar la app a la pantalla
         de inicio: si cambia, hay que quitarla y volver a agregarla. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Eco" />
    <title>Eco</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
