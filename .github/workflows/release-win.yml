name: release-win

# Publica el instalador NSIS de Windows + latest.yml a un GitHub Release para
# que electron-updater pueda auto-actualizar. No corre en cada push (respeta
# "Sergio decide cuándo"): se dispara al empujar un tag vX.Y.Z o a mano desde
# la pestaña Actions.
#
# Requisito: la versión en electron/package.json debe coincidir con el tag
# (electron-updater compara app.getVersion() contra latest.yml).
#
# La subida NO la hace electron-builder (`--publish always`): en v1.0.15 y
# v1.0.16 arrancó dos publishers para la misma versión, cada uno creó SU
# release con el mismo tag (GitHub lo permite) y los assets quedaron repartidos
# entre los dos: la URL releases/download/<tag>/latest.yml resuelve a uno solo
# y daba 404 mientras el job terminaba en verde. Acá electron-builder solo
# construye (y genera latest.yml porque hay un `publish` provider en la config)
# y la subida la hace `gh release upload` sobre un único release por tag; el
# último paso verifica que los tres assets estén en estado `uploaded`.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write  # crear/actualizar el Release y subir los artefactos

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build (NSIS + latest.yml)
        env:
          # Config web de Firebase. Se hornea en el bundle en build-time: el .exe
          # llega a una máquina sin `.env.local`, así que si falta acá, el usuario
          # ve "Firebase no está configurado" y no puede loguearse. Desde v1.0.5
          # el build FALLA si faltan (guard en frontend/vite.config.ts) en vez de
          # publicar un instalador roto en silencio, como pasó de v1.0.1 a v1.0.4.
          #
          # Son identificadores públicos (viajan en cualquier cliente), no
          # credenciales: la autorización real son las Firestore Security Rules.
          # Igual van como secrets para no dejarlos en un repo público.
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        # `--publish never` es obligatorio: en CI electron-builder asume
        # `onTagOrDraft` y, sin GH_TOKEN, aborta el build entero. latest.yml se
        # genera igual (depende del `publish` provider de la config, no del flag).
        shell: bash
        run: |
          set -euo pipefail
          npm run build:all
          npm --workspace electron run build:win -- --publish never

      - name: Publish to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./electron/package.json').version")
          TAG="v$VERSION"
          cd release
          ls -la
          test -f "Eco-Setup-$VERSION.exe"
          test -f "Eco-Setup-$VERSION.exe.blockmap"
          # latest.yml debe apuntar al nombre exacto del asset que subimos.
          grep -q "Eco-Setup-$VERSION.exe" latest.yml
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "Eco $VERSION" --latest
          fi
          gh release upload "$TAG" "Eco-Setup-$VERSION.exe" "Eco-Setup-$VERSION.exe.blockmap" latest.yml \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify published assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./electron/package.json').version")
          TAG="v$VERSION"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq '.assets[] | select(.state == "uploaded") | .name' > uploaded.txt
          cat uploaded.txt
          for f in "Eco-Setup-$VERSION.exe" "Eco-Setup-$VERSION.exe.blockmap" latest.yml; do
            grep -qx "$f" uploaded.txt || { echo "::error::Falta el asset $f en el release $TAG"; exit 1; }
          done
          DRAFT=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.draft')
          [ "$DRAFT" = "false" ] || { echo "::error::El release $TAG quedó en borrador"; exit 1; }
